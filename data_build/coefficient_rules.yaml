# 需要推計の係数（全国都市交通特性調査 R3）を、人口データの年齢7区分に合わせる方法。要件 5.1A、付録B、P1-4。
# Q3：B（2026-10-15 決定）：調査の年齢階層をそのまま使い、平均や重み付けはしない。
#   調査の年齢階層：5～14歳／15～29歳／30～49歳／50～64歳／65～74歳／75歳～
#   人口データ（data_build/population.py）も同じ7区分：0-4／5-14／15-29／30-49／50-64／65-74／75+
age_mapping:
  '0-4':
    # TODO(根拠未確定)：Q2（0～4歳の扱い）は未決定。調査の対象は5歳以上のため、
    # 暫定で5～14歳の値を当てる（従来の挙動を維持）。決まったら、ここの from だけを変える
    # （例：Q2＝B なら外出率0）。人口データの作り直しは不要。
    from: ['5～14歳']
    provisional: true
  '5-14':
    from: ['5～14歳']
  '15-29':
    from: ['15～29歳']
  '30-49':
    from: ['30～49歳']
  '50-64':
    from: ['50～64歳']
  '65-74':
    from: ['65～74歳']
  '75+':
    from: ['75歳～']

# 外出率と組み合わせるトリップ数：外出した人1人あたりの「ネット原単位」を使う
# （要件 5.1 の式は 人口×外出率×1日トリップ数×バス分担率 のため。グロス原単位＝外出率×ネット原単位）
trip_rate: ネット原単位
# バス分担率：代表交通手段別構成比（ネット）の「バス」
bus_share: 構成比（ネット）
