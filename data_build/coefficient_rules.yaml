# 需要推計の係数（全国都市交通特性調査 R3）を、本ツールの年齢4階層に合わせる方法。要件 5.1A、付録B、P1-4。
# TODO(根拠未確定)：以下はすべて暫定案。ユーザーの確認後に確定する。

# 調査の年齢階層：5～14歳／15～29歳／30～49歳／50～64歳／65～74歳／75歳～
# 本ツール：0-14／15-64／65-74／75+
age_mapping:
  '0-14':
    # 暫定：調査の対象は5歳以上のため、0～4歳にも5～14歳の値を当てる
    from: ['5～14歳']
  '15-64':
    # 暫定：15～29・30～49・50～64歳の3区分の単純平均
    from: ['15～29歳', '30～49歳', '50～64歳']
    method: mean
  '65-74':
    from: ['65～74歳']
  '75+':
    from: ['75歳～']

# 外出率と組み合わせるトリップ数：外出した人1人あたりの「ネット原単位」を使う
# （要件 5.1 の式は 人口×外出率×1日トリップ数×バス分担率 のため。グロス原単位＝外出率×ネット原単位）
trip_rate: ネット原単位
# バス分担率：代表交通手段別構成比（ネット）の「バス」
bus_share: 構成比（ネット）
